<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Importando o Cliente do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 p-6">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-xl border border-slate-100 relative">
    
    <!-- Tela de Carregamento (Overlay Sobreposta) -->
    <div id="loadingArea" class="hidden absolute inset-0 bg-white/90 backdrop-blur-sm z-50 rounded-2xl flex flex-col items-center justify-center p-6 text-center">
      <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p id="loadingText" class="text-sm font-bold text-slate-800 animate-pulse">Estamos buscando as melhores transportadoras...</p>
      <p class="text-xs text-slate-500 mt-1">Isso pode levar alguns segundos.</p>
    </div>

    <h2 class="text-xl font-bold text-slate-800 mb-6 border-b pb-2">Informações da Cotação</h2>
    
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">CEP ORIGEM</label>
        <input type="text" id="cepOrigem" placeholder="00000-000" class="w-full p-2 border rounded-lg transition-colors" maxlength="9" oninput="aplicarMascaraCep(this); limparErro(this);" onblur="consultarCep('origem')">
        <span id="cidadeOrigem" class="text-xs text-blue-600 mt-1 block font-bold min-h-[16px]"></span>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">CEP DESTINO</label>
        <input type="text" id="cepDestino" placeholder="00000-000" class="w-full p-2 border rounded-lg transition-colors" maxlength="9" oninput="aplicarMascaraCep(this); limparErro(this);" onblur="consultarCep('destino')">
        <span id="cidadeDestino" class="text-xs text-blue-600 mt-1 block font-bold min-h-[16px]"></span>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">DISTÂNCIA (KM) <span class="text-slate-400 font-normal">(Opcional)</span></label>
        <input type="number" id="distanciaKm" placeholder="Distância" class="w-full p-2 border rounded-lg">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">FATOR CUBAGEM</label>
        <input type="number" id="fatorCubagem" value="300" placeholder="Fator" class="w-full p-2 border rounded-lg transition-colors" oninput="limparErro(this)">
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-semibold text-slate-600 mb-1">VALOR DA CARGA (R$)</label>
        <input type="text" id="valorCarga" placeholder="0,00" class="w-full p-2 border rounded-lg transition-colors" oninput="aplicarMascaraMoeda(this); limparErro(this);">
      </div>
    </div>

    <div class="mb-6">
      <h3 class="text-sm font-semibold text-slate-600 mb-2 uppercase">Volumes</h3>
      <table class="w-full text-xs text-left mb-2">
        <thead class="text-slate-400 border-b">
          <tr>
            <th class="pb-2 w-16">Qtd</th>
            <th class="pb-2">Peso(kg)</th>
            <th class="pb-2">C(cm)</th>
            <th class="pb-2">L(cm)</th>
            <th class="pb-2">A(cm)</th>
          </tr>
        </thead>
        <tbody id="listaVolumes">
          <tr class="volume-row">
            <td class="pt-2 pr-2"><input type="number" class="vol-qtd w-12 border p-1 rounded text-center transition-colors" value="1" oninput="limparErro(this)"></td>
            <td class="pt-2 pr-2"><input type="number" class="vol-peso w-full border p-1 rounded transition-colors" placeholder="0" oninput="limparErro(this)"></td>
            <td class="pt-2 pr-2"><input type="number" class="vol-comp w-full border p-1 rounded transition-colors" placeholder="0" oninput="limparErro(this)"></td>
            <td class="pt-2 pr-2"><input type="number" class="vol-larg w-full border p-1 rounded transition-colors" placeholder="0" oninput="limparErro(this)"></td>
            <td class="pt-2"><input type="number" class="vol-alt w-full border p-1 rounded transition-colors" placeholder="0" oninput="limparErro(this)"></td>
          </tr>
        </tbody>
      </table>
      <button onclick="adicionarLinha()" class="mt-2 text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded font-semibold text-slate-700 transition">+ Adicionar Item</button>
    </div>

    <button id="btnCotar" onclick="executar()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2">
      <span>Fazer Cotação</span>
    </button>

    <div id="resultadoArea" class="mt-6 hidden">
      <h3 class="font-bold text-slate-800 mb-3">Opções de Frete</h3>
      <div id="tabelaResultados" class="space-y-2"></div>
    </div>
  </div>

  <script>
    // Configuração do Supabase (URL ajustada com o seu Project ID correto)
    const SUPABASE_URL = 'https://xnfsmauxjiptnxkjdbz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_jcYMIpCqR7zOEXW7CvThDQ_q-U2JW13'; // Cole aqui a sua 'Publishable key' (começa com sb_publishable_...)
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function aplicarMascaraCep(input) {
      let valor = input.value.replace(/\D/g, '');
      if (valor.length > 8) valor = valor.substring(0, 8);
      if (valor.length > 5) valor = valor.replace(/^(\d{5})(\d)/, '$1-$2');
      input.value = valor;
    }

    function aplicarMascaraMoeda(input) {
      let valor = input.value.replace(/\D/g, '');
      if (valor === '') { input.value = ''; return; }
      valor = (parseFloat(valor) / 100).toFixed(2);
      valor = valor.replace('.', ',');
      valor = valor.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      input.value = valor;
    }

    function limparErro(input) { input.classList.remove('border-red-500', 'bg-red-50'); }
    function marcarErro(input) { input.classList.add('border-red-500', 'bg-red-50'); }

    function consultarCep(tipo) {
      const inputId = tipo === 'origem' ? 'cepOrigem' : 'cepDestino';
      const spanId = tipo === 'origem' ? 'cidadeOrigem' : 'cidadeDestino';
      const inputEl = document.getElementById(inputId);
      const cep = inputEl.value.replace(/\D/g, '');
      const span = document.getElementById(spanId);
      
      if (cep.length !== 8) { span.innerText = ''; return; }
      span.innerText = 'Buscando...';
      
      fetch('https://viacep.com.br/ws/' + cep + '/json/')
        .then(res => res.json())
        .then(data => {
          if (!data.erro) {
            span.innerText = data.localidade + ' - ' + data.uf;
            limparErro(inputEl);
          } else {
            span.innerText = 'CEP não encontrado';
            marcarErro(inputEl);
          }
        })
        .catch(() => span.innerText = 'Erro ao buscar');
    }

    function adicionarLinha() {
      const container = document.getElementById('listaVolumes');
      const row = document.createElement('tr');
      row.className = 'volume-row';
      row.innerHTML = `
        <td class="pt-2 pr-2"><input type="number" class="vol-qtd w-12 border p-1 rounded text-center transition-colors" value="1" oninput="limparErro(this)"></td>
        <td class="pt-2 pr-2"><input type="number" class="vol-peso w-full border p-1 rounded transition-colors" placeholder="0" oninput="limparErro(this)"></td>
        <td class="pt-2 pr-2"><input type="number" class="vol-comp w-full border p-1 rounded transition-colors" placeholder="0" oninput="limparErro(this)"></td>
        <td class="pt-2 pr-2"><input type="number" class="vol-larg w-full border p-1 rounded transition-colors" placeholder="0" oninput="limparErro(this)"></td>
        <td class="pt-2"><input type="number" class="vol-alt w-full border p-1 rounded transition-colors" placeholder="0" oninput="limparErro(this)"></td>
      `;
      container.appendChild(row);
    }

    async function executar() {
      let temErro = false;

      const inputCepOrigem = document.getElementById('cepOrigem');
      if (inputCepOrigem.value.replace(/\D/g, '').length !== 8) { marcarErro(inputCepOrigem); temErro = true; }

      const inputCepDestino = document.getElementById('cepDestino');
      if (inputCepDestino.value.replace(/\D/g, '').length !== 8) { marcarErro(inputCepDestino); temErro = true; }

      const inputFator = document.getElementById('fatorCubagem');
      if (!inputFator.value || parseFloat(inputFator.value) <= 0) { marcarErro(inputFator); temErro = true; }

      const inputValorCarga = document.getElementById('valorCarga');
      if (!inputValorCarga.value.trim()) { marcarErro(inputValorCarga); temErro = true; }

      const rows = document.querySelectorAll('.volume-row');
      let totalPeso = 0, totalCubagem = 0;
      let volumesArray = [];

      rows.forEach(r => {
        const q = parseFloat(r.querySelector('.vol-qtd').value);
        const p = parseFloat(r.querySelector('.vol-peso').value);
        const c = parseFloat(r.querySelector('.vol-comp').value);
        const l = parseFloat(r.querySelector('.vol-larg').value);
        const a = parseFloat(r.querySelector('.vol-alt').value);

        if (isNaN(q) || q <= 0) { marcarErro(r.querySelector('.vol-qtd')); temErro = true; }
        if (isNaN(p) || p <= 0) { marcarErro(r.querySelector('.vol-peso')); temErro = true; }
        if (isNaN(c) || c <= 0) { marcarErro(r.querySelector('.vol-comp')); temErro = true; }
        if (isNaN(l) || l <= 0) { marcarErro(r.querySelector('.vol-larg')); temErro = true; }
        if (isNaN(a) || a <= 0) { marcarErro(r.querySelector('.vol-alt')); temErro = true; }

        if (!temErro) {
          totalPeso += (q * p);
          totalCubagem += (q * (c * l * a) / 1000000);
          volumesArray.push({ qtd: q, peso: p, comp: c, larg: l, alt: a });
        }
      });

      if (temErro) return;

      const btn = document.getElementById('btnCotar');
      const loading = document.getElementById('loadingArea');
      const loadingText = document.getElementById('loadingText');
      const resultadoDiv = document.getElementById('resultadoArea');

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      loadingText.innerText = "Calculando fretes via Supabase...";
      loading.classList.remove('hidden');
      resultadoDiv.classList.add('hidden');

      const valorCargaNum = parseFloat(inputValorCarga.value.replace(/\./g, '').replace(',', '.'));
      const distanciaKmNum = parseFloat(document.getElementById('distanciaKm').value) || 0;
      const fatorCubagemNum = parseFloat(inputFator.value) || 300;

      const pesoCubado = totalCubagem * fatorCubagemNum;
      const pesoTaxavel = Math.max(totalPeso, pesoCubado);
      const cepDestinoStr = inputCepDestino.value;
      const cepDestinoInt = parseInt(cepDestinoStr.replace(/\D/g, ""), 10);

      // Busca dados na tabela de frete do Supabase (nome garantido com underline)
      const { data: matrizTabelas, error } = await supabaseClient.from('tabelas_frete').select('*');

      esconderCarregamento();

      if (error || !matrizTabelas || matrizTabelas.length === 0) {
        alert('Erro ao carregar as tabelas de frete do Supabase: ' + (error ? error.message : 'Tabela vazia'));
        return;
      }

      const tabelasFiltradasPorCep = matrizTabelas.filter(row => {
        const cepInicial = parseInt(row.cep_inicial.toString().replace(/\D/g, ""), 10);
        const cepFinal = parseInt(row.cep_final.toString().replace(/\D/g, ""), 10);
        return (cepDestinoInt >= cepInicial && cepDestinoInt <= cepFinal);
      });

      if (tabelasFiltradasPorCep.length === 0) {
        mostrarResultados([]);
        return;
      }

      const transportadorasMap = {};
      tabelasFiltradasPorCep.forEach(row => {
        const nome = row.nome_transportadora;
        if (!transportadorasMap[nome]) transportadorasMap[nome] = [];
        transportadorasMap[nome].push(row);
      });

      const resultadosFinais = [];

      for (let transportadora in transportadorasMap) {
        const faixas = transportadorasMap[transportadora];
        let faixaSelecionada = null;
        let maiorPesoFinalCadastrado = -1;
        let linhaMaiorFaixaPeso = null;

        faixas.forEach(linha => {
          const pIni = Number(linha.peso_inicial) || 0;
          const pFim = Number(linha.peso_final) || 0;
          if (pFim > maiorPesoFinalCadastrado) {
            maiorPesoFinalCadastrado = pFim;
            linhaMaiorFaixaPeso = linha;
          }
          if (pesoTaxavel >= pIni && pesoTaxavel <= pFim) {
            faixaSelecionada = linha;
          }
        });

        if (!faixaSelecionada && linhaMaiorFaixaPeso && pesoTaxavel > maiorPesoFinalCadastrado) {
          faixaSelecionada = linhaMaiorFaixaPeso;
        }

        if (faixaSelecionada) {
          const fretePesoBase = Number(faixaSelecionada.frete_peso_base) || 0;
          const valorKgExcedente = Number(faixaSelecionada.valor_kg_excedente) || 0;
          const pedagioPor100kg = Number(faixaSelecionada.pedagio_por_100kg) || 0;
          const aliquotaAdvalorem = Number(faixaSelecionada.aliquota_advalorem) || 0;
          const aliquotaGris = Number(faixaSelecionada.aliquota_gris) || 0;
          const tasFixo = Number(faixaSelecionada.tas_fixo) || 0;
          const aliquotaTde = Number(faixaSelecionada.aliquota_tde) || 0;
          const aliquotaTrt = Number(faixaSelecionada.aliquota_trt) || 0;
          const tdaPorKm = Number(faixaSelecionada.tda_por_km) || 0;
          const secatFixo = Number(faixaSelecionada.secat_fixo) || 0;
          const suframaFixo = Number(faixaSelecionada.suframa_fixo) || 0;
          const segFluvialPct = Number(faixaSelecionada.seg_fluvial_pct) || 0;
          const redFluvialPct = Number(faixaSelecionada.red_fluvial_pct) || 0;
          const valorIcmsTabela = Number(faixaSelecionada.valor_icms_tabela) || 0;
          const prazoEntrega = Number(faixaSelecionada.prazo_entrega) || 0;
          const pesoLimiteFaixa = Number(faixaSelecionada.peso_final) || 0;

          let valorExcedente = pesoTaxavel > pesoLimiteFaixa ? (pesoTaxavel - pesoLimiteFaixa) * valorKgExcedente : 0;
          const fretePesoTotal = Math.max(fretePesoBase, valorExcedente);
          const pedagio = Math.ceil(pesoTaxavel / 100) * pedagioPor100kg;
          const advalorem = (aliquotaAdvalorem / 100) * valorCargaNum;
          const gris = (aliquotaGris / 100) * valorCargaNum;
          const tas = tasFixo;
          const tde = (aliquotaTde / 100) * fretePesoTotal;
          const tda = tdaPorKm * distanciaKmNum;
          const secat = secatFixo;
          const suframa = suframaFixo;
          const segFluvial = (segFluvialPct / 100) * valorCargaNum;
          const redFluvial = (redFluvialPct / 100) * valorCargaNum;

          const subtotalAntesTrt = fretePesoTotal + pedagio + advalorem + gris + tas + tde + tda + secat + suframa + segFluvial + redFluvial;
          const trt = (aliquotaTrt / 100) * subtotalAntesTrt;
          const subtotalAntesIcms = subtotalAntesTrt + trt;

          let divisorIcms = 1;
          if (valorIcmsTabela > 0) {
            if (valorIcmsTabela >= 0.50 && valorIcmsTabela < 1.0) divisorIcms = valorIcmsTabela;
            else if (valorIcmsTabela >= 1 && valorIcmsTabela < 100) divisorIcms = 1 - (valorIcmsTabela / 100);
            else if (valorIcmsTabela > 0 && valorIcmsTabela < 0.50) divisorIcms = 1 - valorIcmsTabela;
          }

          const freteTotal = divisorIcms > 0 ? (subtotalAntesIcms / divisorIcms) : subtotalAntesIcms;

          resultadosFinais.push({
            transportadora: transportadora,
            prazo: prazoEntrega,
            freteTotal: freteTotal,
            volumes: volumesArray,
            totalPeso: totalPeso,
            totalCubagem: totalCubagem
          });
        }
      }

      resultadosFinais.sort((a, b) => a.freteTotal - b.freteTotal);
      mostrarResultados(resultadosFinais);
    }

    function esconderCarregamento() {
      const btn = document.getElementById('btnCotar');
      const loading = document.getElementById('loadingArea');
      btn.disabled = false;
      btn.classList.remove('opacity-50', 'cursor-not-allowed');
      loading.classList.add('hidden');
    }

    function mostrarResultados(res) {
      const div = document.getElementById('resultadoArea');
      const tabela = document.getElementById('tabelaResultados');
      tabela.innerHTML = '';
      if (!div) return;
      div.classList.remove('hidden');

      if (!res || res.length === 0) {
        tabela.innerHTML = '<p class="text-xs text-slate-500">Nenhuma transportadora atende a esta rota/peso.</p>';
        return;
      }

      res.forEach(r => {
        tabela.innerHTML += `
          <div class="p-3 bg-white border rounded-lg grid grid-cols-4 gap-2 items-center shadow-sm">
            <div class="text-left font-bold text-sm text-slate-800 truncate" title="${r.transportadora}">${r.transportadora}</div>
            <div class="text-center">
              <span class="text-[11px] font-semibold bg-amber-100 text-amber-700 px-2 py-1 rounded-md border border-amber-200 inline-block">Prazo: ${r.prazo}d</span>
            </div>
            <div class="text-right font-bold text-blue-600 text-xs">R$ ${parseFloat(r.freteTotal).toFixed(2)}</div>
            <div class="text-right">
              <button onclick='contratarFrete(${JSON.stringify(r)})' class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg transition whitespace-nowrap">
                Contratar
              </button>
            </div>
          </div>
        `;
      });
    }

    async function contratarFrete(transportadoraObj) {
      const loading = document.getElementById('loadingArea');
      const loadingText = document.getElementById('loadingText');
      loadingText.innerText = "Salvando contratação no Supabase...";
      loading.classList.remove('hidden');

      const numeroCotacaoGerada = 'COT-' + Math.floor(100000 + Math.random() * 900000);
      const valorCargaNum = parseFloat(document.getElementById('valorCarga').value.replace(/\./g, '').replace(',', '.')) || 0;

      const dadosParaSalvar = {
        numero_cotacao: numeroCotacaoGerada,
        data: new Date().toLocaleDateString('pt-BR'),
        cep_origem: document.getElementById('cepOrigem').value,
        cidade_origem: document.getElementById('cidadeOrigem').innerText,
        cep_destino: document.getElementById('cepDestino').value,
        cidade_destino: document.getElementById('cidadeDestino').innerText,
        transportadora: transportadoraObj.transportadora,
        prazo: transportadoraObj.prazo,
        valor_carga: valorCargaNum,
        valor_frete: transportadoraObj.freteTotal,
        distancia_km: parseFloat(document.getElementById('distanciaKm').value) || 0,
        fator_cubagem: parseFloat(document.getElementById('fatorCubagem').value) || 300,
        total_peso: transportadoraObj.totalPeso,
        total_cubagem: transportadoraObj.totalCubagem,
        volumes: transportadoraObj.volumes
      };

      const { error } = await supabaseClient
        .from('cotacoes_historico')
        .insert([dadosParaSalvar]);

      loading.classList.add('hidden');

      if (error) {
        alert('Erro ao registrar contratação: ' + error.message);
      } else {
        const tabela = document.getElementById('tabelaResultados');
        tabela.innerHTML = `
          <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center space-y-2">
            <p class="text-xs font-bold text-emerald-800 uppercase tracking-wide">Frete Contratado com Sucesso!</p>
            <p class="text-sm font-extrabold text-emerald-900">Número da Cotação: ${numeroCotacaoGerada}</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
